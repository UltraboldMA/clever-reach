name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            livewire: '^3.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '^11.0'
            livewire: '^3.0'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '^12.0'
            livewire: '^4.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            livewire: '^4.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin dependency generation
        run: composer require laravel/framework:${{ matrix.laravel }} livewire/livewire:${{ matrix.livewire }} orchestra/testbench:${{ matrix.testbench }} --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse
